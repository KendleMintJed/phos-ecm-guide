      - Art Gallery: ssd/role-2/art-gallery.md
      - Sweepot: ssd/role-2/sweepot.md
      - Shadow Raid: ssd/role-2/shadow-raid.md
      - Nightclub: ssd/role-2/nightclub.md
    - Role 3:
      - ssd/role-3/index.md
      - Diamond Store: ssd/role-3/diamond-store.md
      - Art Gallery: ssd/role-3/art-gallery.md
      - Sweepot: ssd/role-3/sweepot.md
