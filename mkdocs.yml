site_name: Pho's ECM Rush Guide
theme:
  name: material
  favicon: favicon.png
  logo: ecm.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Toggle dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Toggle light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Toggle auto
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.escapeall:
      hardbreak: true
      nbsp: true
  - pymdownx.fancylists
  - pymdownx.saneheaders

extra_css:
  - stylesheets/extra.css

extra:
  generator: false

nav:
  - Creation Instruction: guide-creation-instructions.md
  - Intro: index.md
  - FAQ: faq.md
  - SSD:
    - ssd/index.md
    - Resources: ssd/resources.md
    - Role 1:
      - ssd/role-1/index.md
      - Diamond Store: ssd/role-1/diamond-store.md
      - Art Gallery: ssd/role-1/art-gallery.md
      - Sweepot: ssd/role-1/sweepot.md
      - Shadow Raid: ssd/role-1/shadow-raid.md
      - Nightclub: ssd/role-1/nightclub.md
    - Role 2:
